<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇯🇵 東京行 Tokyo Trip</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; padding-bottom: 80px; }
        .hidden { display: none; }
        .active-tab { color: #2563eb; border-top: 2px solid #2563eb; }
        
        /* 動畫效果 */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }

        /* 隱藏 Scrollbar 但保持滑動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md shadow-sm z-40 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-gray-800 tracking-tight">
                <i class="fas fa-plane-departure text-blue-600 mr-2"></i>東京行
            </h1>
            <p class="text-xs text-gray-400" id="currentDateDisplay">2024.06.01 - 06.07</p>
        </div>
        <div class="bg-gray-100 rounded-full px-3 py-1 flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500">匯率</span>
            <input type="number" id="rateInput" value="0.22" step="0.001" onchange="updateRate()" 
                   class="w-12 bg-transparent text-right font-bold text-blue-600 outline-none border-b border-gray-300 focus:border-blue-500">
        </div>
    </div>

    <div class="h-16"></div>

    <div id="page-schedule" class="page-section px-4 pt-4">
        
        <div class="flex overflow-x-auto no-scrollbar gap-3 mb-4 pb-2" id="dayTabsContainer">
            </div>

        <div id="scheduleList" class="space-y-4">
            <div class="text-center text-gray-400 py-10">載入中...</div>
        </div>

        <button onclick="openEditModal()" class="fixed bottom-24 right-4 bg-blue-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl active:scale-90 transition-transform z-30">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div id="page-expense" class="page-section hidden px-4 pt-4">
        
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">
            <h2 class="text-gray-500 text-sm font-bold mb-4 uppercase tracking-wider">總消費統計</h2>
            <div class="flex justify-between items-end mb-2">
                <div>
                    <span class="text-3xl font-black text-gray-800" id="totalExpenseJPY">0</span>
                    <span class="text-sm text-gray-400">JPY</span>
                </div>
                <div class="text-right">
                    <div class="text-lg font-bold text-blue-600" id="totalExpenseTWD">NT$ 0</div>
                </div>
            </div>
        </div>

        <div class="mb-6">
            <button onclick="calculateSettlement()" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <div class="bg-white/20 p-2 rounded-full">
                    <i class="fas fa-calculator text-xl"></i>
                </div>
                <span class="text-xl">一鍵結算：誰該給誰錢？</span>
            </button>
        </div>

        <h3 class="font-bold text-gray-800 mb-3">消費明細 (依時間排序)</h3>
        <div id="expenseList" class="space-y-3 pb-10">
            </div>
    </div>

    <div id="page-checklist" class="page-section hidden px-4 pt-4">
        <div class="flex gap-2 mb-4">
            <input type="text" id="newCheckItem" placeholder="新增待辦/必買..." class="flex-1 bg-white p-3 rounded-xl shadow-sm outline-none">
            <button onclick="addCheckItem()" class="bg-blue-600 text-white px-5 rounded-xl font-bold">新增</button>
        </div>
        <div id="checklistContainer" class="space-y-2">
            </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 pb-5 z-40 text-xs text-gray-400 font-medium">
        <button onclick="switchTab('schedule')" class="nav-btn active-tab flex flex-col items-center w-full py-1" id="btn-schedule">
            <i class="fas fa-calendar-alt text-xl mb-1"></i> 行程
        </button>
        <button onclick="switchTab('expense')" class="nav-btn flex flex-col items-center w-full py-1" id="btn-expense">
            <i class="fas fa-yen-sign text-xl mb-1"></i> 花費
        </button>
        <button onclick="switchTab('checklist')" class="nav-btn flex flex-col items-center w-full py-1" id="btn-checklist">
            <i class="fas fa-check-square text-xl mb-1"></i> 清單
        </button>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full rounded-t-3xl p-6 h-[85vh] overflow-y-auto animate-slide-up relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">新增行程</h3>
                <button onclick="closeModal()" class="text-gray-400 bg-gray-100 w-8 h-8 rounded-full"><i class="fas fa-times"></i></button>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-500 mb-1">時間</label>
                        <input type="time" id="inpStart" class="w-full bg-gray-50 p-3 rounded-xl">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-500 mb-1">標題</label>
                        <input type="text" id="inpTitle" class="w-full bg-gray-50 p-3 rounded-xl font-bold" placeholder="例如: 淺草雷門">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">類別</label>
                    <div class="flex gap-2 overflow-x-auto pb-2" id="categorySelector">
                        </div>
                    <input type="hidden" id="inpCategory" value="other">
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">地點 / 備註</label>
                    <input type="text" id="inpLocation" class="w-full bg-gray-50 p-3 rounded-xl" placeholder="Google Map 連結或備註">
                </div>

                <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                    <h4 class="font-bold text-yellow-700 mb-3 text-sm"><i class="fas fa-coins mr-1"></i> 消費記錄 (選填)</h4>
                    
                    <div class="flex items-center gap-2 mb-3">
                        <input type="number" id="inpAmount" placeholder="金額 (JPY)" class="flex-1 p-2 rounded-lg border border-yellow-200">
                        <input type="text" id="inpDesc" placeholder="說明 (午餐/門票)" class="flex-1 p-2 rounded-lg border border-yellow-200">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-yellow-600 mb-1">付款歸屬 (誰享受?)</label>
                            <select id="inpPayer" class="w-full p-2 rounded-lg bg-white border border-yellow-200 text-sm">
                                <option value="shared">🤝 共同分攤</option>
                                <option value="bird">🐦 Dove 個人</option>
                                <option value="pig">🐷 Pig 個人</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-yellow-600 mb-1">誰先墊錢 (錢包?)</label>
                            <select id="inpAdvance" class="w-full p-2 rounded-lg bg-white border border-yellow-200 text-sm">
                                <option value="bird">🐦 Dove 先付</option>
                                <option value="pig">🐷 Pig 先付</option>
                            </select>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="editingId">

                <div class="pt-4 flex gap-3">
                    <button onclick="deleteItem()" id="btnDelete" class="bg-red-100 text-red-500 py-3 px-4 rounded-xl hidden"><i class="fas fa-trash"></i></button>
                    <button onclick="saveItem()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settlementModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl animate-slide-up">
            <div class="bg-gray-900 text-white p-6 text-center relative">
                <h3 class="text-2xl font-bold mb-1">💰 最終結算</h3>
                <p class="text-gray-400 text-sm">統計所有 7 天的行程花費</p>
                <button onclick="closeSettlementModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-blue-50 p-4 rounded-2xl">
                        <div class="text-xs text-gray-500 mb-1">Dove 先墊付了</div>
                        <div class="font-bold text-xl text-blue-600" id="totalDovePaid">0</div>
                        <div class="text-xs text-gray-400">JPY</div>
                    </div>
                    <div class="bg-pink-50 p-4 rounded-2xl">
                        <div class="text-xs text-gray-500 mb-1">Pig 先墊付了</div>
                        <div class="font-bold text-xl text-pink-600" id="totalPigPaid">0</div>
                        <div class="text-xs text-gray-400">JPY</div>
                    </div>
                </div>
                <div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-6 text-center">
                    <div class="text-gray-600 font-medium mb-2">最終結算結果</div>
                    <div id="finalResult" class="text-3xl font-black text-gray-800 my-2">計算中...</div>
                    <div id="finalResultTWD" class="text-sm text-gray-500">(約 TWD 0)</div>
                </div>
                <div class="text-xs text-gray-400 text-center">
                    <p>計算公式：(共同花費÷2) + (幫對方墊付的個人花費)</p>
                </div>
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-100">
                <button onclick="closeSettlementModal()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl">知道了</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl z-50 transition-opacity opacity-0 pointer-events-none text-sm font-medium">
        提示訊息
    </div>

    <script>
        // ================= 1. 初始化與設定 =================
        // ⚠️ 請在此填入您的 Firebase Config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 全域變數
        const COLLECTION_NAME = 'TokyoTrip2024';
        const CONFIG_DOC = 'config';
        let currentDay = 1;
        let exchangeRate = 0.22;
        let currentScheduleData = [];

        // 類別設定
        const CATEGORIES = [
            { id: 'food', icon: 'fa-utensils', label: '美食', color: 'bg-orange-100 text-orange-600' },
            { id: 'spot', icon: 'fa-camera', label: '景點', color: 'bg-blue-100 text-blue-600' },
            { id: 'shop', icon: 'fa-shopping-bag', label: '購物', color: 'bg-pink-100 text-pink-600' },
            { id: 'transport', icon: 'fa-train', label: '交通', color: 'bg-green-100 text-green-600' },
            { id: 'hotel', icon: 'fa-bed', label: '住宿', color: 'bg-purple-100 text-purple-600' },
            { id: 'other', icon: 'fa-star', label: '其他', color: 'bg-gray-100 text-gray-600' }
        ];

        // 啟動
        window.onload = async function() {
            renderDayTabs();
            renderCategoryButtons();
            
            // 讀取匯率
            const configSnap = await db.collection(COLLECTION_NAME).doc(CONFIG_DOC).get();
            if (configSnap.exists && configSnap.data().rate) {
                exchangeRate = configSnap.data().rate;
                document.getElementById('rateInput').value = exchangeRate;
            }

            loadSchedule(1);
        };

        // ================= 2. 核心功能: 行程 =================

        // 渲染天數按鈕
        function renderDayTabs() {
            const container = document.getElementById('dayTabsContainer');
            let html = '';
            const dates = ['6/1', '6/2', '6/3', '6/4', '6/5', '6/6', '6/7'];
            for(let i=1; i<=7; i++) {
                html += `
                    <button onclick="loadSchedule(${i})" id="dayBtn${i}" 
                        class="flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all ${i===1 ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-500 border'}">
                        Day ${i} <span class="text-xs font-normal block">${dates[i-1]}</span>
                    </button>`;
            }
            container.innerHTML = html;
        }

        // 讀取行程
        async function loadSchedule(day) {
            currentDay = day;
            
            // UI 更新
            for(let i=1; i<=7; i++) {
                const btn = document.getElementById(`dayBtn${i}`);
                if(i === day) {
                    btn.className = "flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all bg-blue-600 text-white shadow-md";
                } else {
                    btn.className = "flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all bg-white text-gray-500 border";
                }
            }

            const listDiv = document.getElementById('scheduleList');
            listDiv.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-2xl text-blue-500"></i></div>';

            try {
                const doc = await db.collection(COLLECTION_NAME).doc(`day${day}`).get();
                currentScheduleData = doc.exists ? (doc.data().schedule || []) : [];
                
                // 排序：按時間
                currentScheduleData.sort((a, b) => a.startTime.localeCompare(b.startTime));
                
                renderScheduleList();
            } catch (e) {
                console.error(e);
                listDiv.innerHTML = '<div class="text-center text-red-500">載入失敗</div>';
            }
        }

        // 渲染列表 HTML
        function renderScheduleList() {
            const listDiv = document.getElementById('scheduleList');
            if (currentScheduleData.length === 0) {
                listDiv.innerHTML = '<div class="text-center text-gray-400 py-10">尚無行程，點擊右下角 + 新增</div>';
                return;
            }

            let html = '';
            currentScheduleData.forEach((item, index) => {
                const cat = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[5];
                const expense = (item.expenses && item.expenses.length > 0) ? item.expenses[0] : null;

                html += `
                <div onclick="openEditModal(${index})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-4 active:bg-gray-50 transition-colors cursor-pointer">
                    <div class="flex flex-col items-center pt-1 min-w-[50px]">
                        <span class="font-bold text-gray-700 font-mono text-lg">${item.startTime}</span>
                        <div class="h-full w-0.5 bg-gray-100 mt-2"></div>
                    </div>
                    <div class="flex-1 pb-2">
                        <div class="flex justify-between items-start mb-1">
                            <span class="${cat.color} px-2 py-0.5 rounded text-xs font-bold">${cat.label}</span>
                            ${expense ? `<span class="text-gray-900 font-bold">¥${parseInt(expense.amount).toLocaleString()}</span>` : ''}
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-1">${item.title}</h3>
                        ${item.location ? `<p class="text-xs text-gray-400"><i class="fas fa-map-marker-alt mr-1"></i>${item.location}</p>` : ''}
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        // ================= 3. 編輯與新增 (Modal) =================

        function renderCategoryButtons() {
            const container = document.getElementById('categorySelector');
            container.innerHTML = CATEGORIES.map(c => `
                <button onclick="selectCategory('${c.id}')" id="catBtn-${c.id}" class="cat-btn flex-shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-500 text-xs font-bold border border-transparent">
                    <i class="fas ${c.icon} mr-1"></i>${c.label}
                </button>
            `).join('');
        }

        function selectCategory(id) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50', 'text-blue-600');
                b.classList.add('bg-gray-100', 'text-gray-500');
            });
            const btn = document.getElementById(`catBtn-${id}`);
            btn.classList.remove('bg-gray-100', 'text-gray-500');
            btn.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50', 'text-blue-600');
            document.getElementById('inpCategory').value = id;
        }

        function openEditModal(index = -1) {
            const modal = document.getElementById('editModal');
            modal.classList.remove('hidden');
            
            document.getElementById('editingId').value = index;
            document.getElementById('btnDelete').classList.toggle('hidden', index === -1);
            document.getElementById('modalTitle').innerText = index === -1 ? '新增行程' : '編輯行程';

            if (index > -1) {
                const data = currentScheduleData[index];
                document.getElementById('inpStart').value = data.startTime;
                document.getElementById('inpTitle').value = data.title;
                document.getElementById('inpLocation').value = data.location || '';
                selectCategory(data.category || 'other');

                if (data.expenses && data.expenses.length > 0) {
                    const ex = data.expenses[0];
                    document.getElementById('inpAmount').value = ex.amount;
                    document.getElementById('inpDesc').value = ex.description;
                    document.getElementById('inpPayer').value = ex.payer;
                    document.getElementById('inpAdvance').value = ex.advancePayer;
                } else {
                    resetExpenseInputs();
                }
            } else {
                document.getElementById('inpStart').value = '10:00';
                document.getElementById('inpTitle').value = '';
                document.getElementById('inpLocation').value = '';
                selectCategory('spot');
                resetExpenseInputs();
            }
        }

        function resetExpenseInputs() {
            document.getElementById('inpAmount').value = '';
            document.getElementById('inpDesc').value = '';
            document.getElementById('inpPayer').value = 'shared';
            document.getElementById('inpAdvance').value = 'bird';
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveItem() {
            const index = parseInt(document.getElementById('editingId').value);
            const startTime = document.getElementById('inpStart').value;
            const title = document.getElementById('inpTitle').value;
            if(!title) return showToast('請輸入標題');

            const item = {
                startTime,
                title,
                category: document.getElementById('inpCategory').value,
                location: document.getElementById('inpLocation').value,
                expenses: []
            };

            const amt = document.getElementById('inpAmount').value;
            if (amt) {
                item.expenses.push({
                    amount: parseInt(amt),
                    description: document.getElementById('inpDesc').value || title,
                    payer: document.getElementById('inpPayer').value,
                    advancePayer: document.getElementById('inpAdvance').value
                });
            }

            if (index === -1) {
                currentScheduleData.push(item);
            } else {
                currentScheduleData[index] = item;
            }

            try {
                await db.collection(COLLECTION_NAME).doc(`day${currentDay}`).set({ schedule: currentScheduleData });
                closeModal();
                loadSchedule(currentDay);
                showToast('已儲存');
            } catch (e) {
                alert('儲存失敗');
            }
        }

        async function deleteItem() {
            if(!confirm('確定刪除?')) return;
            const index = parseInt(document.getElementById('editingId').value);
            currentScheduleData.splice(index, 1);
            
            await db.collection(COLLECTION_NAME).doc(`day${currentDay}`).set({ schedule: currentScheduleData });
            closeModal();
            loadSchedule(currentDay);
            showToast('已刪除');
        }

        // ================= 4. 花費與統計 (Expense) =================

        async function loadExpenses() {
            const listDiv = document.getElementById('expenseList');
            listDiv.innerHTML = '載入中...';
            
            let allExpenses = [];
            let totalJPY = 0;

            for(let i=1; i<=7; i++) {
                const doc = await db.collection(COLLECTION_NAME).doc(`day${i}`).get();
                if(doc.exists) {
                    const items = doc.data().schedule || [];
                    items.forEach(item => {
                        if(item.expenses) {
                            item.expenses.forEach(ex => {
                                allExpenses.push({
                                    day: i,
                                    title: item.title,
                                    ...ex
                                });
                                totalJPY += parseInt(ex.amount);
                            });
                        }
                    });
                }
            }

            document.getElementById('totalExpenseJPY').innerText = totalJPY.toLocaleString();
            document.getElementById('totalExpenseTWD').innerText = `NT$ ${Math.round(totalJPY * exchangeRate).toLocaleString()}`;

            let html = '';
            allExpenses.forEach(ex => {
                const payerMap = { 'bird': 'Dove', 'pig': 'Pig', 'shared': '共同' };
                const payerColor = ex.payer === 'shared' ? 'bg-gray-100 text-gray-500' : (ex.payer === 'bird' ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600');
                
                html += `
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100">
                    <div>
                        <div class="text-xs text-gray-400 mb-1">Day ${ex.day} · ${ex.description}</div>
                        <div class="font-bold text-gray-800">${ex.title}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-gray-900">¥${parseInt(ex.amount).toLocaleString()}</div>
                        <span class="text-[10px] px-2 py-0.5 rounded ${payerColor}">${payerMap[ex.payer]}</span>
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html || '<div class="text-center text-gray-400">尚無消費紀錄</div>';
        }

        // ================= 5. 一鍵結算 (Settlement) =================

        async function calculateSettlement() {
            showToast('🧮 正在計算...');
            let totalDovePaid = 0; // Dove 錢包出
            let totalPigPaid = 0;  // Pig 錢包出
            let balance = 0;       // 正數: Pig欠Dove, 負數: Dove欠Pig

            try {
                for (let i = 1; i <= 7; i++) {
                    const doc = await db.collection(COLLECTION_NAME).doc(`day${i}`).get();
                    if (doc.exists) {
                        const items = doc.data().schedule || [];
                        items.forEach(item => {
                            if (item.expenses) {
                                item.expenses.forEach(ex => {
                                    const amount = parseFloat(ex.amount) || 0;
                                    
                                    // 1. 誰先墊付
                                    if (ex.advancePayer === 'bird') totalDovePaid += amount;
                                    else if (ex.advancePayer === 'pig') totalPigPaid += amount;

                                    // 2. 債務計算
                                    if (ex.payer === 'shared') {
                                        if (ex.advancePayer === 'bird') balance += (amount / 2);
                                        if (ex.advancePayer === 'pig') balance -= (amount / 2);
                                    } else if (ex.payer === 'pig') {
                                        if (ex.advancePayer === 'bird') balance += amount;
                                    } else if (ex.payer === 'bird') {
                                        if (ex.advancePayer === 'pig') balance -= amount;
                                    }
                                });
                            }
                        });
                    }
                }

                document.getElementById('totalDovePaid').innerText = totalDovePaid.toLocaleString();
                document.getElementById('totalPigPaid').innerText = totalPigPaid.toLocaleString();
                
                const resultDiv = document.getElementById('finalResult');
                const resultTWDDiv = document.getElementById('finalResultTWD');
                const absBalance = Math.abs(balance);
                
                if (balance > 0) {
                    resultDiv.innerHTML = `<span class="text-pink-600">Pig</span> <span class="text-sm text-gray-400">給</span> <span class="text-blue-600">Dove</span><br>${Math.round(balance).toLocaleString()} <span class="text-base">JPY</span>`;
                } else if (balance < 0) {
                    resultDiv.innerHTML = `<span class="text-blue-600">Dove</span> <span class="text-sm text-gray-400">給</span> <span class="text-pink-600">Pig</span><br>${Math.round(absBalance).toLocaleString()} <span class="text-base">JPY</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="text-green-500">帳目已平！</span>`;
                }
                resultTWDDiv.innerText = `(約 TWD ${Math.round(absBalance * exchangeRate).toLocaleString()})`;
                
                document.getElementById('settlementModal').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert('計算失敗');
            }
        }
        function closeSettlementModal() {
            document.getElementById('settlementModal').classList.add('hidden');
        }

        // ================= 6. 清單功能 (Checklist) =================
        async function loadChecklist() {
            const div = document.getElementById('checklistContainer');
            div.innerHTML = '載入中...';
            const snap = await db.collection(COLLECTION_NAME + '_checklist').get();
            let html = '';
            snap.forEach(doc => {
                const d = doc.data();
                html += `
                <div class="flex items-center gap-3 bg-white p-3 rounded-xl border ${d.done ? 'opacity-50' : ''}">
                    <input type="checkbox" ${d.done ? 'checked' : ''} onchange="toggleCheck('${doc.id}', this.checked)" class="w-5 h-5">
                    <span class="flex-1 ${d.done ? 'line-through text-gray-400' : ''}">${d.text}</span>
                    <button onclick="deleteCheck('${doc.id}')" class="text-red-300"><i class="fas fa-times"></i></button>
                </div>`;
            });
            div.innerHTML = html;
        }

        async function addCheckItem() {
            const txt = document.getElementById('newCheckItem').value;
            if(!txt) return;
            await db.collection(COLLECTION_NAME + '_checklist').add({ text: txt, done: false, created: Date.now() });
            document.getElementById('newCheckItem').value = '';
            loadChecklist();
        }

        async function toggleCheck(id, val) {
            await db.collection(COLLECTION_NAME + '_checklist').doc(id).update({ done: val });
            loadChecklist();
        }

        async function deleteCheck(id) {
            if(!confirm('刪除?')) return;
            await db.collection(COLLECTION_NAME + '_checklist').doc(id).delete();
            loadChecklist();
        }

        // ================= 7. 工具函數 =================

        function switchTab(tab) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('active-tab', 'text-blue-600');
                b.classList.add('text-gray-400');
            });
            document.getElementById(`btn-${tab}`).classList.add('active-tab', 'text-blue-600');
            document.getElementById(`btn-${tab}`).classList.remove('text-gray-400');

            if(tab === 'expense') loadExpenses();
            if(tab === 'checklist') loadChecklist();
        }

        function updateRate() {
            exchangeRate = parseFloat(document.getElementById('rateInput').value);
            db.collection(COLLECTION_NAME).doc(CONFIG_DOC).set({ rate: exchangeRate }, { merge: true });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2000);
        }

    </script>
</body>
</html>
